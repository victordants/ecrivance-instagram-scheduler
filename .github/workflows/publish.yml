name: Publish scheduled Instagram posts
on:
  schedule:
    # GitHub drops/delays scheduled runs (an hourly cron was firing only every 3–7 h). So we retry every 15 min,
    # but only in 2-hour windows around the publish slots — 10:00, 13:00, 19:00 Pacific — covering both PDT (UTC-7)
    # and PST (UTC-8). ~24 runs/day keeps the private repo inside the free Actions minutes. run.mjs publishes
    # whatever is due today and catches up one older post per run, so one successful run per window is enough.
    - cron: "4,19,34,49 17,18,20,21,2,3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be published"
        type: boolean
        default: true
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node run.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
